version: "3.9"

services:
  pipeline:
    build: .
    command: >
      sh -c "python data/generate_data.py && python run_pipeline.py"
    volumes:
      - ./data:/app/data
      - ./evaluation/reports:/app/evaluation/reports

  api:
    build: .
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./evaluation/reports:/app/evaluation/reports
    depends_on:
      - pipeline

  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    volumes:
      - ./evaluation/reports:/app/evaluation/reports
    depends_on:
      - pipeline
